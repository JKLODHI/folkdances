            font-size: 2.2em;
            font-weight: bold;
        }

        .dances-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .dance-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .dance-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .dance-image {
            width: 100%;
            height: 250px;
            overflow: hidden;
        }

        .dance-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dance-content {
            padding: 25px;
        }

        .dance-name {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .dance-meaning {
            color: #667eea;
            font-size: 1em;
            margin-bottom: 15px;
            font-style: italic;
            padding: 12px;
            background: #f0f4ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .dance-description {
            color: #555;
            line-height: 1.7;
            font-size: 1em;
        }

        // This is a test - showing only one state first
        console.log("Dance data loaded:", dances);

        // Function to render all dances
        function loadDances() {
            const content = document.getElementById('content');

            for (let state in dances) {
                // Create state section
                const stateSection = document.createElement('div');
                stateSection.className = 'state-section';

                // Create state header
                const stateHeader = document.createElement('div');
                stateHeader.className = 'state-header';
                stateHeader.textContent = state;
                stateSection.appendChild(stateHeader);

                // Create dances grid
                const grid = document.createElement('div');
                grid.className = 'dances-grid';

                // Add each dance
                dances[state].forEach(dance => {
                    const card = document.createElement('div');
                    card.className = 'dance-card';

                    card.innerHTML = `
                        <div class="dance-image">
                            <img src="${dance.image}" alt="${dance.name}">
                        </div>
                        <div class="dance-content">
                            <div class="dance-name">${dance.name}</div>
                            <div class="dance-meaning">${dance.meaning}</div>
                            <div class="dance-description">${dance.description}</div>
                        </div>
                    `;

                    grid.appendChild(card);
                });

                stateSection.appendChild(grid);
                content.appendChild(stateSection);
            }

            console.log("Dances loaded successfully!");
        }

        // Load dances when page loads
        window.onload = function() {
            loadDances();
        };

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.dance-card');
            const sections = document.querySelectorAll('.state-section');

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });

            sections.forEach(section => {
                const visibleCards = section.querySelectorAll('.dance-card[style="display: block;"], .dance-card:not([style*="display: none"])');
                if (visibleCards.length === 0 && searchTerm !== '') {
                    section.style.display = 'none';
                } else {
                    section.style.display = 'block';
                }
            });
        });
